# ============================================================
# Perun EEG OSC Streamer - Configuration
# Edit this file before running setup.sh
# ============================================================

[device]
# Device number (1-9)
# Sets static IP to 192.168.1.5<N> and OSC port to 788<N>
number = 1

# Perun headset model: perun8 or perun32
type = perun8

# Perun USB device index (usually 0)
usb_index = 0

# Hostname to set on the RPi (leave empty to keep current)
hostname = pilsl1

[network]
# WiFi credentials
wifi_ssid = Sound
wifi_password = 71241081

# Gateway / DNS
gateway = 192.168.1.1

# Static IP override (leave empty to auto-generate from device number: 192.168.1.5<N>)
static_ip =

[osc]
# PC IP address (OSC destination)
pc_ip = 192.168.1.23

# OSC port override (leave empty to auto-generate from device number: 788<N>)
port =

# OSC send rate in Hz
fps = 15

[processing]
# Sampling rate in Hz (Perun 8 hardware fixed at 500)
sample_rate = 500

# FFT window size in seconds
fft_window = 1.0

# EEG frequency bands (Hz)
theta = 4-8
alpha = 8-13
beta = 13-30
gamma = 30-50

[channels]
# Active EEG channels (comma-separated, order matters)
# Perun 8 default: P3,Cz,O2,P4,C3,O1,Pz,C4
active = P3,Cz,O2,P4,C3,O1,Pz,C4

[deploy]
# SSH key path for remote deployment from PC (leave empty to skip key-based auth)
ssh_key =

# SSH user on the RPi
ssh_user = pi

# SSH password (used only if ssh_key is empty)
ssh_password = zero1
